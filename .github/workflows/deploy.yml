name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-wms
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    env:
      APP_DIR: /home/cpc_services/apps/wms-cpc
    steps:
      - name: Pull latest code
        run: |
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main

      - name: Show what's deployed
        run: |
          cd "$APP_DIR"
          echo "Deploying in: $(pwd)"
          git log -1 --oneline

      - name: Write .env from GitHub
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          cd "$APP_DIR"
          if [ -z "$ENV_FILE" ]; then echo "::error::ENV_FILE secret is empty"; exit 1; fi
          printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
          chmod 600 .env

      - name: Build and restart
        run: |
          cd "$APP_DIR"
          docker compose up -d --build --remove-orphans --wait --wait-timeout 180

      # nginx resolves the backend/frontend upstream names once at startup, so
      # when those containers are recreated with new IPs an untouched nginx keeps
      # proxying to the old ones (502s). Reload it on every deploy so it
      # re-resolves the upstreams and picks up any nginx.conf change.
      - name: Reload nginx
        run: |
          cd "$APP_DIR"
          docker compose exec -T nginx nginx -t
          docker compose exec -T nginx nginx -s reload

      - name: Verify through nginx
        run: |
          cd "$APP_DIR"
          APP_PORT=$(grep -E '^APP_PORT=' .env | tail -n1 | cut -d= -f2- | tr -d '"' || true)
          url="http://127.0.0.1:${APP_PORT:-83}/"
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null "$url"; then echo "nginx OK at $url"; exit 0; fi
            sleep 3
          done
          echo "::error::nginx did not respond at $url after reload"
          docker compose logs --tail 50 nginx
          exit 1

      - name: Clean up old images
        if: success()
        run: docker image prune -f
